<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>单人博客 Demo</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">单人博客 Demo</a>
    <nav>
      <a href="/admin/articles">后台管理</a>
    </nav>
  </header>

  <main class="container">
    <h1>文章列表</h1>

    {% if articles %}
      <div class="article-list">
        {% for article in articles %}
          <article class="article-item">
            <h2><a href="/articles/{{ article.id }}">{{ article.title }}</a></h2>
            <p class="meta">发布于 {{ article.created_at }}</p>
            <p>{{ article.summary or "这篇文章暂时没有摘要。" }}</p>
          </article>
        {% endfor %}
      </div>
    {% else %}
      <p class="empty">还没有文章。请先登录后台发布第一篇文章。</p>
    {% endif %}
  </main>
</body>
</html>
